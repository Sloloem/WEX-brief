plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.6'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.openapi.generator' version '7.22.0'
	id 'jacoco'
}

group = 'com.pxa.wex'
version = '0.0.1-SNAPSHOT'

ext {
	mapstructVersion = '1.6.3'
	testcontainersVersion = '2.0.5'
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(26)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-liquibase'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-restclient'
	implementation 'org.springframework.boot:spring-boot-starter-quartz'
	implementation 'org.springframework.boot:spring-boot-starter-opentelemetry'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.1'
	
	implementation "org.mapstruct:mapstruct:${mapstructVersion}"
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
	runtimeOnly 'io.micrometer:micrometer-registry-otlp'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	annotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"

	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-liquibase-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

dependencyManagement {
    imports {
        mavenBom "org.testcontainers:testcontainers-bom:${testcontainersVersion}"
    }
}

tasks.named('test') {
	useJUnitPlatform()
	finalizedBy tasks.named('jacocoTestReport')
}

tasks.named('jacocoTestReport') {
	dependsOn tasks.named('test')
	// TODO: Exclude generated code from coverage reporting.
}

tasks.named('bootBuildImage') {
	imageName = "${project.name}:LOCAL"
	// Do we need to support OS X?  Does the jammy builder still have issues with the M1's?
}

tasks.named('compileJava') {
	dependsOn tasks.named('openApiGenerate')
}

openApiGenerate {
	cleanupOutput = true
	generatorName = "spring"
	inputSpec = "${rootDir}/open-api/transactiondb.yml"
	outputDir = "${buildDir}/generated"
	apiPackage = "${group}.transactiondb.controller"
	modelPackage = "${group}.transactiondb.dto"
	generateModelTests = false
	generateModelDocumentation = false
	generateApiTests = false
	generateApiDocumentation = false
	ignoreFileOverride = ".openapi-generator-ignore"
	configOptions = [
		generateSupportingFiles : "false",
		useTags					: "true",

		openApiNullable			: "false",
		generateBuilders		: "true",
		useSpringBoot4			: "true",
		useSpringController		: "true",
		delegatePattern			: "true",
		requestMappingMode		: "controller",
		performBeanValidation	: "true"
	]
}

sourceSets {
	main {
		java {
			srcDirs += file("${buildDir}/generated/src/main/java")
		}
	}
}